name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    attributes:
      label: How to reproduce
      description: The smallest steps or code that show the problem.
    validations:
      required: true
  - type: input
    attributes:
      label: Version
      description: Package or image version, and your platform.
